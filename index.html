<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBay Open Scraper (No API Key)</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { color: var(--accent); }

        .controls {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--radius);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
        }

        input, select {
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: var(--radius);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--border); cursor: not-allowed; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }

        .card-img { width: 100%; height: 200px; object-fit: cover; background: #000; }
        .card-body { padding: 15px; }
        .price { color: #10b981; font-weight: bold; font-size: 1.2rem; margin: 5px 0; }
        .title { font-size: 0.95rem; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }
        .link { display: block; margin-top: 10px; color: var(--accent); text-decoration: none; font-size: 0.9rem; }

        .loader { text-align: center; padding: 40px; display: none; }
        .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error { color: #ef4444; text-align: center; padding: 20px; background: rgba(239, 68, 68, 0.1); border-radius: var(--radius); display: none; }
        
        @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🕷️ eBay Open Scraper</h1>
        <small style="color: var(--text-secondary)">No API Key Required</small>
    </header>

    <div class="controls">
        <input type="text" id="keyword" placeholder="Search keyword (e.g. vintage camera)" value="vintage camera">
        <select id="country">
            <option value="www.ebay.com">🇺🇸 USA</option>
            <option value="www.ebay.co.uk">🇬🇧 UK</option>
            <option value="www.ebay.de">🇩🇪 Germany</option>
            <option value="www.ebay.ca">🇨🇦 Canada</option>
            <option value="www.ebay.com.au">🇦🇺 Australia</option>
        </select>
        <select id="sort">
            <option value="_sop=10">Newly Listed</option>
            <option value="_sop=12">Best Match (Top Sellers)</option>
            <option value="_sop=15">Lowest Price + Shipping</option>
        </select>
        <button id="searchBtn">Scrape Data</button>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="loader" id="loader"><div class="spinner"></div><p>Fetching HTML from eBay...</p></div>
    <div class="grid" id="results"></div>
</div>

<script>
    const searchBtn = document.getElementById('searchBtn');
    const resultsDiv = document.getElementById('results');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');

    searchBtn.addEventListener('click', async () => {
        const keyword = document.getElementById('keyword').value.trim();
        const countryBase = document.getElementById('country').value;
        const sortParam = document.getElementById('sort').value;

        if (!keyword) return alert("Please enter a keyword");

        // Reset UI
        resultsDiv.innerHTML = '';
        errorMsg.style.display = 'none';
        loader.style.display = 'block';
        searchBtn.disabled = true;

        try {
            // Construct eBay Search URL
            // _sop=10 is Newly Listed, _sop=12 is Best Match
            const targetUrl = `https://${countryBase}/sch/i.html?_nkw=${encodeURIComponent(keyword)}&${sortParam}&_ipg=24`;
            
            // We MUST use a CORS proxy because browsers block direct requests to ebay.com
            // Using allorigins.win as it is reliable for HTML scraping
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            const response = await fetch(proxyUrl);
            const data = await response.json();

            if (!data.contents) throw new Error("Failed to fetch page content");

            // Parse the HTML string into a DOM object
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');

            // --- SCRAPPING LOGIC ---
            // Note: eBay class names change frequently. These are current common selectors.
            // We look for the main listing cards.
            
            // Strategy: Find all listing items. 
            // On modern eBay, listings are often in <li class="s-item"> or similar structures.
            const items = doc.querySelectorAll('.s-item');
            
            if (items.length === 0) {
                throw new Error("No items found. eBay may have blocked the request or changed their layout.");
            }

            let count = 0;
            items.forEach(item => {
                if (count >= 24) return; // Limit to 24 items

                // Extract Title
                const titleEl = item.querySelector('.s-item__title');
                const title = titleEl ? titleEl.innerText.replace('NEW Listing', '').trim() : 'No Title';

                // Extract Price
                const priceEl = item.querySelector('.s-item__price');
                const price = priceEl ? priceEl.innerText : 'N/A';

                // Extract Image
                const imgEl = item.querySelector('.s-item__image-img');
                let imgUrl = imgEl ? imgEl.src : null;
                
                // Fallback for image if src is missing but data-src exists
                if (!imgUrl && imgEl) imgUrl = imgEl.getAttribute('data-src') || imgEl.getAttribute('srcset')?.split(' ')[0];
                if (!imgUrl) imgUrl = 'https://via.placeholder.com/300x200?text=No+Image';

                // Extract Link
                const linkEl = item.querySelector('.s-item__link');
                const link = linkEl ? linkEl.href : '#';

                // Extract Location (Sourcing) - Often in a specific span
                const locationEl = item.querySelector('.s-item__location');
                const location = locationEl ? locationEl.innerText.replace('from ', '') : 'Unknown Location';

                // Create Card
                if (title && title !== 'Shop on eBay') { // Filter out "Shop on eBay" ads
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imgUrl}" class="card-img" alt="${title}" onerror="this.src='https://via.placeholder.com/300x200?text=Error'">
                        <div class="card-body">
                            <div class="title">${title}</div>
                            <div class="price">${price}</div>
                            <div class="meta">📍 ${location}</div>
                            <a href="${link}" target="_blank" class="link">View on eBay →</a>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                    count++;
                }
            });

            if (count === 0) {
                errorMsg.innerText = "Found elements but couldn't parse data. eBay layout may have updated.";
                errorMsg.style.display = 'block';
            }

        } catch (err) {
            console.error(err);
            errorMsg.innerText = "Error: " + err.message;
            errorMsg.style.display = 'block';
        } finally {
            loader.style.display = 'none';
            searchBtn.disabled = false;
        }
    });
</script>

</body>
</html>
